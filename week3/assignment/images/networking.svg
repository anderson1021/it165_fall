<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">Simple computer network</title>
  <desc id="description">Two computers connect to a switch, and the switch connects to a router.</desc>
  <rect width="720" height="360" fill="#edf5fb"/>
  <rect x="25" y="24" width="670" height="312" rx="22" fill="#fff" stroke="#c7deec" stroke-width="3"/>
  <path d="M160 148 L330 238 M560 148 L390 238 M360 225 L360 122" fill="none" stroke="#407da3" stroke-width="8" stroke-linecap="round"/>
  <g fill="#184966" stroke="#0c3048" stroke-width="4">
    <rect x="87" y="82" width="146" height="98" rx="9"/>
    <rect x="487" y="82" width="146" height="98" rx="9"/>
    <rect x="289" y="222" width="142" height="75" rx="12"/>
    <rect x="304" y="54" width="112" height="72" rx="13"/>
  </g>
  <g fill="#7ccef0">
    <rect x="99" y="94" width="122" height="70" rx="3"/>
    <rect x="499" y="94" width="122" height="70" rx="3"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="360" y="97" font-size="20">Router</text>
    <text x="360" y="268" font-size="20">Switch</text>
  </g>
  <g fill="#173c55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="160" y="210">Computer 1</text>
    <text x="560" y="210">Computer 2</text>
  </g>
</svg>

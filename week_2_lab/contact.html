<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Anderson</title>
</head>
<body>
  <header>
    <h1>contact me</h1>
    <nav>
      <ul>
        <li><a href="index.html">home</a></li>
        <li><a href="contact.html">contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>send a message</h2>
      <p>fill out the form below to get in touch with me.</p>

      <form action="#" method="post">
        <fieldset>
          <legend>your information</legend>

          <div>
            <label for="full-name">full name</label>
            <input type="text" id="full-name" name="full-name" required minlength="3">
          </div>

          <div>
            <label for="email">email address</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div>
            <label for="phone">phone number</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890">
          </div>
        </fieldset>

        <fieldset>
          <legend>message details</legend>

          <div>
            <span>reason for contact</span>

            <div>
              <input type="radio" id="coursework" name="subject" value="coursework" required>
              <label for="coursework">coursework question</label>
            </div>

            <div>
              <input type="radio" id="project" name="subject" value="project">
              <label for="project">project collaboration</label>
            </div>

            <div>
              <input type="radio" id="other" name="subject" value="other">
              <label for="other">other</label>
            </div>
          </div>

          <div>
            <label for="message">message</label>
            <textarea id="message" name="message" required minlength="10" rows="5"></textarea>
          </div>
        </fieldset>

        <button type="submit">submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Anderson Benitez. all rights reserved.</p>
    <p>created with semantic html5 and native form validation.</p>
  </footer>
</body>
</html>
